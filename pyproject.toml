[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "parametric-verification-and-control"
version = "0.1.0"
description = "Parametric verification and control synthesis for stochastic systems"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Kaushik Mallik"}
]

dependencies = [
    "polyqent>=0.0.15",
    "numpy>=2.0.0",
    "PySMT>=0.9.6",
    "lark>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
